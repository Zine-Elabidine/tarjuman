[project]
name = "tarjuman"
version = "0.0.1"
description = "One neutral language for every LLM provider: switch models mid-conversation without losing anything."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zine-Elabidine LAABOUDI", email = "zine.elabidine251@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]
keywords = ["llm", "anthropic", "openai", "agents", "tool-calling", "streaming"]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "PL"]
ignore = [
    "PLR2004",            # magic numbers: limits are named where they matter
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # complexity is tracked in reviews
    "PLC0415",            # lazy imports are deliberate (the TUI loads only when used)
    "RUF001",             # typographic characters in UI strings are intended
    "SIM105",             # try/except/pass reads fine
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
